<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Rompimento - Laboratório</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h2>Controle de Rompimento</h2>
        <div id="data-atual" class="data-topo"></div>
    </header>

    <div id="painel-alertas">
        </div>

    <!-- Calculadora de MPA -->
    <div class="calculadora-container">
        <h3>Calculadora de Resistência</h3>
        
        <div class="calc-box">
            <div class="input-group">
                <label>Leitura (kN):</label>
                <input type="number" id="leituraKN" placeholder="Leitura do CP" oninput="calcularMPA()">
            </div>

            <div class="input-group">
                <label>Dimensões do CP:</label>
                <select id="dimensaoCP" onchange="calcularMPA()">
                    <option value="10x20">10x20 cm</option>
                    <option value="5x10">5x10 cm</option>
                </select>
            </div>

            <div class="resultado-box">
                <span>MPA:</span>
                <strong id="resultadoMPA">0.00</strong>
            </div>
        </div>
    </div>

    <footer class="footer-lab">
    <div class="footer-content">
        <div class="footer-section">
            <p>&copy; 2026 Controle de Qualidade - Ensaiar</p>
        </div>

        <div class="footer-section">
            <span class="version">v1.0.2 - Luis</span>
        </div>
    </div>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
